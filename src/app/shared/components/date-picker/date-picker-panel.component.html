<!--
  El panel entero es `position: fixed` y lo coloca el componente: por eso no
  lleva `top` ni `left` escritos aquí.
-->
<div
  class="picker-panel"
  [class.is-sheet]="asSheet"
  role="dialog"
  [attr.aria-label]="t('datePicker.title')"
>
  @if (showsCalendar()) {
    <div class="picker-head">
      <button
        type="button"
        class="picker-nav"
        (click)="prevMonth()"
        [attr.aria-label]="t('datePicker.previousMonth')"
      >
        <i class="pi pi-chevron-left"></i>
      </button>
      <span class="picker-month" aria-live="polite">{{ monthLabel() }}</span>
      <button
        type="button"
        class="picker-nav"
        (click)="nextMonth()"
        [attr.aria-label]="t('datePicker.nextMonth')"
      >
        <i class="pi pi-chevron-right"></i>
      </button>
    </div>

    <div class="picker-weekdays" aria-hidden="true">
      @for (d of weekdays(); track $index) {
        <span>{{ d }}</span>
      }
    </div>

    <div class="picker-grid" role="grid">
      @for (c of cells(); track c.date.getTime()) {
        <button
          type="button"
          class="picker-day"
          role="gridcell"
          [class.is-outside]="!c.inMonth"
          [class.is-today]="c.today"
          [class.is-selected]="c.selected"
          [disabled]="c.disabled"
          [attr.aria-selected]="c.selected"
          (click)="pickDay(c)"
        >
          {{ c.date.getDate() }}
        </button>
      }
    </div>
  }

  @if (showsTime()) {
    <!--
      Las 24 horas y nada más: el campo sigue admitiendo el teclado para
      cualquier minuto que haya que pactar fuera de la hora en punto.

      ⚠️ **Cada ficha dice «10:00» y no «10», y es por no confundirlas con los
      días.** Debajo de una rejilla de números del 1 al 31, veinticuatro números
      sueltos del 00 al 23 se leen como más días — lo dijo Dorel el 8 de octubre
      de 2026 mirándolo. Los dos puntos y los dos ceros lo resuelven solos, sin
      rótulo ni icono; lo que cuesta es letra más pequeña, que es exactamente lo
      que además ayuda a distinguirlas del calendario de arriba.
    -->
    <div class="picker-time" [class.with-calendar]="showsCalendar()">
      <div class="picker-time-col" [attr.aria-label]="t('datePicker.hours')">
        @for (h of hours; track h) {
          <button
            type="button"
            class="picker-time-item"
            [class.is-selected]="pickedHour() === h"
            (click)="pickHour(h)"
          >
            {{ pad(h) }}:00
          </button>
        }
      </div>
      <!--
        ⚠️ **Aquí había una columna de MINUTOS de cinco en cinco, y se quitó el
        7 de octubre de 2026.** Eran doce opciones más que recorrer con el
        pulgar para un negocio que pacta las entregas en punto, y la hora real
        de la entrega la fija el parte, no este campo. La hora se guarda
        siempre con el minuto a 0 — ver `pickHour()`.
      -->
    </div>
  }

  <!--
    ⚠️ **«Borrar» es la ÚNICA forma de vaciar una fecha**, desde que el aspa
    dejó de ponerse en estos campos (24 de septiembre de 2026). Antes no había
    ninguna: el diálogo de fecha de Android solo trae «Cancelar» y «Aceptar»,
    así que una fecha puesta por error no se podía quitar ni con el dedo ni con
    el teclado. Va a la izquierda y separado de los otros dos, que no destruyen
    nada.
  -->
  <div class="picker-foot">
    <button type="button" class="picker-clear" (click)="clear()">
      {{ t('datePicker.clear') }}
    </button>
    <span class="picker-foot-right">
      <button type="button" class="picker-now" [disabled]="nowDisabled()" (click)="pickNow()">
        {{ showsCalendar() ? t('datePicker.today') : t('datePicker.now') }}
      </button>
      <!--
        ⚠️ **Dice «Seleccionar» y no «Cerrar», y no es solo la palabra.** El
        panel escribe en el campo en cuanto se toca un día, así que el botón
        cierra en los dos casos; lo que cambia es lo que el operador cree que
        pasa al pulsarlo. «Cerrar» se lee como salir sin guardar —y con el
        pulgar, delante de un cliente, eso hace dudar—, cuando lo que hace es
        dar por buena la fecha. Lo pidió Dorel el 7 de octubre de 2026.
      -->
      <button type="button" class="picker-close" (click)="closed.emit()">
        {{ t('datePicker.select') }}
      </button>
    </span>
  </div>
</div>
