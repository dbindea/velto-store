<?xml version="1.0" encoding="UTF-8"?>
<!--
  Velto favicon.

  Unlike the in-app logos, the favicon lives in browser chrome, which follows
  the OS colour scheme rather than the app's own light/dark toggle. So here
  `prefers-color-scheme` is the correct mechanism — it is NOT correct for the
  in-app logos, which must follow the user's stored preference instead.

  Default (no media support) is black ink, which is legible on the light tab
  strips that most browsers still use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566.93 510.24" role="img" aria-label="Velto">
  <style>
    .ink { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; }
    }
  </style>
  <path fill="#20a48f" d="M437.28,146.45l-134.29,229.19h-39.07l-26-44.36,45.54-77.68,63.27-107.99c4-6.82,11.31-11.01,19.21-11.01h64.54c6.08,0,9.87,6.6,6.79,11.85Z"/>
  <path class="ink" d="M269.32,229.47l-49.14-83.86c-4-6.82-11.31-11.01-19.21-11.01H68.74l12.29,7.68c47.83,29.89,87.71,70.92,116.23,119.58l26.54,45.3,45.52-77.69Z"/>
</svg>
