# Previsualización de PRs, siempre contra DESARROLLO (velto-store).
# Un canal de preview no debe tocar nunca el proyecto de producción.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
      - run: npm run build

      # Vista previa del backoffice.
      #
      # ⚠️ El `target` hace falta también aquí: un canal de vista previa cuelga
      # de un sitio concreto, así que sin él no está claro de cuál.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VELTO_STORE }}
          projectId: velto-store
          target: backoffice

      # Y de la web pública, que también se revisa antes de mezclar.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VELTO_STORE }}
          projectId: velto-store
          target: web
