# Despliegue de PRODUCCIÓN — rentalcar-veltomobility.
#
# master -> build:prod (environment.production.ts) -> rentalcar-veltomobility,
# que sirve rentalcar.veltomobility.com.
#
# ⚠️ Las tres líneas de abajo van juntas y no se tocan por separado: la
# configuración de build, el `projectId` y el service account. Si cambia una
# sola, se publica una app compilada contra un proyecto en el hosting de otro,
# y el fallo es silencioso — el sitio carga y escribe en la base equivocada.
#
# ⚠️ `firebase init hosting:github` REESCRIBE este fichero sin avisar. Ya pasó
# el 28 de agosto de 2026: dejó `npm ci && npm run build`, que compila contra
# desarrollo, apuntando al hosting de producción. Si vuelves a ejecutarlo,
# revisa este fichero después.
#
# ⚠️ **Desde el 25 de septiembre de 2026 el proyecto tiene DOS sitios** —el
# backoffice y la web pública— y por eso cada despliegue lleva su `target`
# explícito. Sin él, `action-hosting-deploy` no sabe cuál de los dos publicar:
# o falla, o —peor— sube el build de Angular al sitio de la web pública y la
# deja sirviendo el backoffice a cualquiera que pase. El `target` se resuelve
# contra `.firebaserc`, donde está la correspondencia con el id de cada sitio.
# ⚠️ **Y se puede lanzar A MANO, que es lo que pidió Dorel el 8 de octubre de
# 2026.** El motivo no es comodidad: la web pública **prerrenderiza la flota al
# compilar**, así que un coche dado de alta después del último despliegue existe
# para quien entra en la página —lo trae el JavaScript— y **no existe para
# WhatsApp ni para Google**: su enlace sale con la foto genérica y su ficha no
# entra en el sitemap. Lo mismo con un cambio de tarifa, que viaja dentro del
# `og:description`.
#
# Hasta hoy la única forma de republicar era mergear algo a `master`, o sea
# inventarse un commit. Con esto hay un botón: **Actions -> Deploy to Firebase
# Hosting on merge -> Run workflow**.
#
# ⚠️ **Y el barrido nocturno existe por lo mismo**: para que un coche publicado
# un martes no dependa de que alguien se acuerde de pulsar nada. Son las 04:15
# UTC, que en España es de madrugada en los dos horarios; GitHub no garantiza la
# hora exacta y aquí da igual.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
      - run: npm run build:prod

      # El backoffice: rentalcar.veltomobility.com
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RENTALCAR_VELTOMOBILITY }}
          channelId: live
          projectId: rentalcar-veltomobility
          target: backoffice

      # La web pública: veltomobility.com (y veltorent.com, que redirige).
      #
      # ⚠️ Su build es INDEPENDIENTE del de Angular y va después, no antes: si
      # fallara, el backoffice ya está publicado. Son dos productos en un
      # repositorio, y que uno no salga no puede impedir que salga el otro.
      - run: npm --prefix web ci
      #
      # ⚠️ **`build:prod`, y aquí ponía `build`.** Es el ÚNICO sitio que compila
      # el sitio de verdad, y esa diferencia es la que decide dos cosas que no
      # pueden salir iguales en los dos entornos: el `robots.txt`
      # (`Allow` aquí, `Disallow` en desarrollo) y el `<meta name="robots">`.
      #
      # Hasta el 25 de septiembre de 2026 los tres workflows corrían `build` a
      # secas, así que la web salía **idéntica** para los dos sitios y
      # `velto-web-dev.web.app` se ofrecía al índice de Google con una canónica
      # apuntando a producción: un duplicado del escaparate compitiendo con el
      # original. Es el mismo reparto que `--configuration production` hace en
      # Angular con `fileReplacements`.
      #
      # ⚠️ Ojo: `astro build` usa el modo `production` POR DEFECTO, así que el
      # modo por defecto no distingue nada. Lo que distingue es el `--mode live`
      # que `build:prod` pasa, y que lee `ES_SITIO_REAL` en `web/src/lib/empresa.ts`.
      - run: npm --prefix web run build:prod

      # ⚠️ **Que el artefacto sea el de producción se COMPRUEBA, no se supone.**
      # Toda la distinción entre los dos sitios cuelga de una comparación de
      # cadenas (`MODE === 'live'`) y de que la línea de arriba diga `build:prod`
      # y no `build`. Si alguien la cambia —o si un `astro build` futuro deja de
      # respetar `--mode`—, no falla nada: se publica el escaparate real con el
      # `noindex` de desarrollo puesto, y **Google lo retira del índice** sin que
      # ningún test, ningún tipo y ningún despliegue se queje.
      #
      # Las dos comprobaciones son las dos caras del mismo hecho, a propósito:
      # una mira lo que TIENE que estar y la otra lo que NO puede estar.
      - name: El artefacto de la web es el del sitio real
        run: |
          set -e
          grep -q '^Sitemap:' web/dist/robots.txt \
            || { echo "::error::web/dist/robots.txt no anuncia sitemap: esto es un build de DESARROLLO"; exit 1; }
          if grep -l 'name="robots"' web/dist/*.html; then
            echo "::error::hay páginas con <meta name=robots> (noindex): esto es un build de DESARROLLO"
            exit 1
          fi
          echo "OK: robots.txt con sitemap y ninguna página con noindex"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RENTALCAR_VELTOMOBILITY }}
          channelId: live
          projectId: rentalcar-veltomobility
          target: web

      # ⚠️ **La purga va DESPUÉS de publicar, y es lo que hace seguro cachear
      # el HTML en el borde.** El HTML de Astro no lleva huella en el nombre
      # —`/flota`, no `/flota.A1B2C3.html`—, así que una copia cacheada en
      # Cloudflare sobrevive al despliegue: sin este paso, lo que se acaba de
      # publicar no se vería hasta vencer el TTL, y el síntoma sería «he
      # desplegado y no cambia nada», que es de los que llevan a buscar el
      # fallo en el sitio equivocado.
      #
      # ⚠️ **Y NO rompe el despliegue si falla** (`continue-on-error`). Lo que
      # se publica ya está publicado; que la purga no entre es un retraso de
      # minutos, y tumbar el workflow por eso daría un rojo que no se
      # corresponde con lo que pasó. Lo que sí hace es avisar.
      #
      # El token es de permiso único —Zone → Cache Purge— y está limitado a la
      # zona de `veltomobility.com`: no puede tocar DNS ni reglas.
      - name: Vaciar la caché de Cloudflare
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -u
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ZONE}" ]; then
            echo "::warning::Sin CLOUDFLARE_API_TOKEN o CLOUDFLARE_ZONE_ID: no se purga nada"
            exit 0
          fi
          respuesta=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "${respuesta}"
          # ⚠️ La API de Cloudflare contesta 200 con `"success": false` cuando
          # el token no vale: mirar solo el código HTTP daría por buena una
          # purga que no ocurrió.
          echo "${respuesta}" | grep -q '"success":true' \
            || { echo "::warning::Cloudflare no confirmó la purga"; exit 1; }
          echo "Caché de Cloudflare vaciada"
